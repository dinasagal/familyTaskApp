name: Trigger Sanity Tests

on:
  push:
    branches:
      - main

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger QA repository workflow
        run: |
          curl -X POST \
          -H "Authorization: token ${{ secrets.QA_TRIGGER_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/dinasagal/python-qa-framework/dispatches \
          -d '{"event_type":"run-sanity"}'
